<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Roos</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/CSS/roos.css">
</head>
<body>
  <h1>Radar Roosdiagram</h1>
  <canvas id="roosChart"></canvas>

  <script>
    // Haal labels en waarden op uit sessionStorage
    const labels = JSON.parse(sessionStorage.getItem('labels')) || ['Slecht', 'Neutraal', 'Goed', 'Zeer goed'];
    const values = JSON.parse(sessionStorage.getItem('values')) || [2, 5, 7, 9];

    const ctx = document.getElementById('roosChart').getContext('2d');

    new Chart(ctx, {
      type: 'radar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Beoordeling',
          data: values,
          fill: true,
          backgroundColor: 'rgba(78, 115, 223, 0.2)',
          borderColor: 'rgba(78, 115, 223, 1)',
          pointBackgroundColor: 'rgba(78, 115, 223, 1)',
          pointBorderColor: '#fff',
        }]
      },
      options: {
        responsive: true,
        scales: {
          r: {
            min: 1,
            max: 10,
            ticks: { stepSize: 1 },
            pointLabels: { font: { size: 14 } }
          }
        }
      }
    });
  </script>
</body>
</html>

<button id="saveData">Opslaan in database</button>

<script>
document.getElementById('saveData').addEventListener('click', function() {
  // Haal de data op
  const labels = JSON.parse(sessionStorage.getItem('labels')) || ['Slecht', 'Neutraal', 'Goed', 'Zeer goed'];
  const values = JSON.parse(sessionStorage.getItem('values')) || [2, 5, 7, 9];

  // Verstuur via POST naar PHP
  fetch('opslaan.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: `labels[]=${labels.join('&labels[]=')}&values[]=${values.join('&values[]=')}`
  })
  .then(response => response.text())
  .then(data => alert(data))
  .catch(error => alert('Fout bij opslaan: ' + error));
});
</script>
