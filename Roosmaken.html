<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labels</title>
  <link rel="stylesheet" href="../CSS/roos.css">
</head>
<body>
  <h1>Labels aanpassen</h1>

  <div class="controls">
    <label><span>Label 1</span><input type="text" id="label1" value="Slecht"></label>
    <label><span>Label 2</span><input type="text" id="label2" value="Neutraal"></label>
    <label><span>Label 3</span><input type="text" id="label3" value="Goed"></label>
    <label><span>Label 4</span><input type="text" id="label4" value="Zeer goed"></label>
  </div>

  <button onclick="nextStep()">Volgende</button>

  <script>
    function nextStep() {
      // Haal de waarden op van de inputvelden
      const labels = [
        document.getElementById('label1').value || 'Label 1',
        document.getElementById('label2').value || 'Label 2',
        document.getElementById('label3').value || 'Label 3',
        document.getElementById('label4').value || 'Label 4'
      ];
      
      // Sla de labels op in sessionStorage zodat andere pagina's ze kunnen gebruiken
      sessionStorage.setItem('labels', JSON.stringify(labels));

      // Ga naar de pagina om waarden in te vullen
      window.location.href = 'Rooswaardes.html';
    }
  </script>
</body>
</html>
